# CCGS（Claude-Code-Game-Studios）から取り込んだ、フロントマターの無いMarkdownを
# グラフに含めない（PDR-0003）。CCGSのスキルやフックがこれらのパスを決め打ちで
# 読むので、docs/から動かせない。docs_dirを変えたら、ここも書き直す。
# docs/architecture/は、/architecture-decisionがCCGSの書式でADRを書く場所である（PDR-0006）。
exclude = [
  "docs/architecture/",
  "docs/engine-reference/",
  "docs/CLAUDE.md",
  "docs/COLLABORATIVE-DESIGN-PRINCIPLE.md",
  "docs/WORKFLOW-GUIDE.md",
  "docs/migration-guide-v1.1.md",
  "docs/skill-flow-diagrams.md",
]

# ノード種別（#16）。決定の記録を、PDR・TDR・ADRの3つの種別に分ける。
# 種別を1つでも書くと、書いたものが種別の全体になる（META-02の「プロジェクトごとの種別」）。
# そのため、architecture・domain・usecase・contractは、tools/graph/schema.pyの既定の
# NODE_TYPES・REQUIRED_SECTIONS・REQUIRED_SECTIONS_REFINED・TERM_TYPESを同じ内容で書き写した。
# 上流（graph-doc-template）が既定の種別を変えても、ここには届かない。上流の変更履歴を見て、手で合わせる。
# 50番台は決定の記録である。PDRは50、TDRは51、ADRは52に置く。53はゲームデザインの決定（DDR）に空けてある。
# 番号は、PDR・TDR・ADRで1つの列を使う。

[node_types.architecture]
prefix = "ARCH"
dir = "10-architecture"
layer = 10
label = "アーキテクチャ"
required_sections = ["解決したい構造上の問題"]
required_sections_refined = []

[node_types.domain]
prefix = "DOM"
dir = "20-domain"
layer = 20
label = "ドメイン"
terms = true
required_sections = ["定義", "不変条件", "用語"]
required_sections_refined = ["不変条件", "用語"]

[node_types.usecase]
prefix = "UC"
dir = "30-usecases"
layer = 30
label = "ユースケース"
required_sections = ["概要", "事前条件"]

[node_types.contract]
prefix = "CON"
dir = "40-contracts"
layer = 40
label = "契約"
required_sections = []

# 開発の進め方の決定。道具、テンプレート、手順、文書の置き場。
[node_types.pdr]
prefix = "PDR"
dir = "50-pdr"
layer = 90
exempt_layer = true
immutable = true
label = "開発の進め方の決定"
required_sections = ["背景", "決定", "理由", "却下した案", "影響", "見直しの条件"]

# ゲームの外の技術の決定。エンジンとその版、言語、ライブラリ、対応する機種、ビルドと書き出し。
[node_types.tdr]
prefix = "TDR"
dir = "51-tdr"
layer = 90
exempt_layer = true
immutable = true
label = "ゲームの外の技術の決定"
required_sections = ["背景", "決定", "理由", "却下した案", "影響", "見直しの条件"]

# ゲームの中の構成の決定。イベントの仕組み、セーブデータの形、シーンの分け方など。
[node_types.adr]
prefix = "ADR"
dir = "52-adr"
layer = 90
exempt_layer = true
immutable = true
label = "ゲームの中の構成の決定"
required_sections = ["背景", "決定", "理由", "却下した案", "影響", "見直しの条件"]
