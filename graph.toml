extend_default_types = true

# CCGS（Claude-Code-Game-Studios）から取り込んだ、フロントマターの無いMarkdownを
# グラフに含めない（PDR-0006）。CCGSのスキルやフックがこれらのパスを決め打ちで
# 読むので、docs/から動かせない。docs_dirを変えたら、ここも書き直す。
# docs/architecture/には、CCGSのスキルが書くADR以外の文書（architecture.md、control-manifest.md、
# tr-registry.yamlなど）を置く。TDRはdocs/51-tdr/に、ADRはdocs/52-adr/に置く（PDR-0006）。
exclude = [
  "docs/architecture/",
  "docs/engine-reference/",
  "docs/CLAUDE.md",
  "docs/COLLABORATIVE-DESIGN-PRINCIPLE.md",
  "docs/WORKFLOW-GUIDE.md",
  "docs/migration-guide-v1.1.md",
  "docs/skill-flow-diagrams.md",
]

# ノード種別（#16）。決定の記録を、PDR・TDR・ADR・DDRの4つの種別に分ける。
# 一番上のextend_default_types = trueで、ここに書いた種別を既定の種別に足す（META-02の「プロジェクトごとの種別」）。
# architecture・domain・usecase・contractは、書かずに既定のものを使う。
# 同じ名前のadrは、既定を丸ごと上書きする。そのためimmutableとrequired_sectionsも書いたままにしてある。
# 50番台は決定の記録である。PDRは50、TDRは51、ADRは52、DDRは53に置く。
# 番号は種別ごとに0001から振る。
# 4つの種別の雛形は、上流と共通のdocs/00-meta/templates/の外のdocs/templates/に置き、
# 各種別のtemplateで指す。共通のフォルダに置くと、上流が同じ名前の雛形を変えたときに取り込みで競合する。

# 開発の進め方の決定。道具、テンプレート、手順、文書の置き場。
[node_types.pdr]
prefix = "PDR"
dir = "50-pdr"
layer = 90
exempt_layer = true
immutable = true
label = "開発の進め方の決定"
required_sections = ["背景", "決定", "理由", "却下した案", "影響", "見直しの条件"]
template = "docs/templates/pdr.md"

# TDRとADRの節は、CCGSのADRの雛形の節を日本語にしたものである。状態はフロントマターのstatusだけに持つ（PDR-0006）。
# 最終確認日（CCGSのLast Verified）は、本文の節にせず、フロントマターのlast_verifiedに持つ（PDR-0007）。
# ゲームの外の技術の決定。エンジンとその版、言語、ライブラリ、対応する機種、ビルドと書き出し。
[node_types.tdr]
prefix = "TDR"
dir = "51-tdr"
layer = 90
exempt_layer = true
immutable = true
label = "ゲームの外の技術の決定"
required_sections = ["日付", "決めた人", "要約", "エンジンとの互換", "前提のADR", "背景", "決定", "検討した案", "影響", "リスク", "対応するGDDの要件", "性能への影響", "移行の手順", "確かめ方", "関連"]
template = "docs/templates/tdr.md"

# ゲームの中の構成の決定。イベントの仕組み、セーブデータの形、シーンの分け方など。
[node_types.adr]
prefix = "ADR"
dir = "52-adr"
layer = 90
exempt_layer = true
immutable = true
label = "ゲームの中の構成の決定"
required_sections = ["日付", "決めた人", "要約", "エンジンとの互換", "前提のADR", "背景", "決定", "検討した案", "影響", "リスク", "対応するGDDの要件", "性能への影響", "移行の手順", "確かめ方", "関連"]
template = "docs/templates/adr.md"

# ゲームデザインの決定。プレイヤーができること、見るもの、感じることが変わるもの（PDR-0006）。
# ADRとの境は「プレイヤーから違いが分かるか」で決める。節はPDRと同じ6節にする。
# DDRの本文に対応するGDD（design/gdd/）のパスを書き、GDDにも関するDDRを書く。
# GDDはgraphの外にあるので、GDDからDDRへの参照は機械では確かめない。
[node_types.ddr]
prefix = "DDR"
dir = "53-ddr"
layer = 90
exempt_layer = true
immutable = true
label = "ゲームデザインの決定"
required_sections = ["背景", "決定", "理由", "却下した案", "影響", "見直しの条件"]
template = "docs/templates/ddr.md"
